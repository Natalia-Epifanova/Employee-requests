{% extends "requests_app/base.html" %}

{% block title %}Создание сотрудника{% endblock %}

{% block content %}
<div class="card form-card">
    <h2>Создание сотрудника</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Сохранить</button>
            <a class="button secondary" href="{% url 'requests_app:employee_list' %}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
